<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --bg: #0a0e0c;
  --bg-2: #0f1411;
  --bg-3: #141a16;
  --surface: #1a211d;
  --surface-2: #232b26;
  --ink: #f4f1ea;
  --ink-dim: #b8b4ab;
  --ink-mute: #6f6c64;
  --line: rgba(244,241,234,0.08);
  --line-strong: rgba(244,241,234,0.18);
  --moss: #7fb389;
  --moss-bright: #a3d4ad;
  --moss-deep: #2d5a3d;
  --amber: #d4a574;
  --rust: #c97a4b;
  --paper: #f4f1ea;
  --paper-2: #ebe6dc;
  --paper-3: #ddd6c8;
  --paper-ink: #1a1f1c;
  --display: 'Fraunces', Georgia, serif;
  --sans: 'Inter Tight', system-ui, sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, monospace;
}

html{scroll-behavior:smooth;background:var(--bg)}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);font-size:16px;line-height:1.6;overflow-x:hidden;-webkit-font-smoothing:antialiased;font-feature-settings:'ss01','cv11'}

::selection{background:var(--moss);color:var(--bg)}

/* ─── NOISE OVERLAY ─── */
body::before{
  content:'';
  position:fixed;
  inset:0;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' /%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.5'/%3E%3C/svg%3E");
  opacity:0.04;
  pointer-events:none;
  z-index:9999;
  mix-blend-mode:overlay;
}

/* ─── NAV ─── */
nav{
  position:fixed;
  top:0;left:0;right:0;
  z-index:100;
  padding:1rem clamp(1.5rem,4vw,3rem);
  display:flex;align-items:center;justify-content:space-between;
  transition:background 0.3s,backdrop-filter 0.3s,border-color 0.3s;
  border-bottom:1px solid transparent;
}
nav.scrolled{
  background:rgba(10,14,12,0.7);
  backdrop-filter:blur(20px) saturate(140%);
  -webkit-backdrop-filter:blur(20px) saturate(140%);
  border-bottom-color:var(--line);
}
.nav-logo{
  font-family:var(--display);
  font-weight:400;
  font-size:1.25rem;
  color:var(--ink);
  text-decoration:none;
  letter-spacing:-0.02em;
  display:flex;
  align-items:center;
  gap:0.6rem;
}
.nav-logo::before{
  content:'';
  width:8px;height:8px;
  background:var(--moss);
  border-radius:50%;
  box-shadow:0 0 12px var(--moss);
}
.nav-links{display:flex;gap:2.25rem;list-style:none;align-items:center}
.nav-links a{
  font-size:0.82rem;font-weight:400;
  color:var(--ink-dim);text-decoration:none;
  letter-spacing:0.01em;
  transition:color 0.2s;
  position:relative;
}
.nav-links a:hover{color:var(--ink)}
.nav-cta{
  background:var(--ink)!important;
  color:var(--bg)!important;
  padding:0.55rem 1.15rem;
  border-radius:100px;
  font-weight:500!important;
  transition:transform 0.2s,background 0.2s!important;
}
.nav-cta:hover{background:var(--moss-bright)!important;color:var(--bg)!important;transform:translateY(-1px)}
.nav-hamburger{display:none;background:none;border:none;cursor:pointer;flex-direction:column;gap:5px;padding:6px}
.nav-hamburger span{display:block;width:22px;height:1.5px;background:var(--ink);transition:all 0.25s}

/* ─── HERO ─── */
.hero{
  position:relative;
  min-height:100vh;
  padding:clamp(8rem,15vw,12rem) clamp(1.5rem,5vw,3rem) clamp(4rem,8vw,6rem);
  display:flex;align-items:center;
  overflow:hidden;
}

.hero-bg{
  position:absolute;inset:0;
  z-index:0;
  background:
    radial-gradient(ellipse 80% 60% at 20% 20%, rgba(127,179,137,0.12), transparent 60%),
    radial-gradient(ellipse 60% 50% at 85% 70%, rgba(212,165,116,0.08), transparent 60%),
    radial-gradient(ellipse 50% 40% at 50% 100%, rgba(45,90,61,0.2), transparent 70%);
}

.hero-grid{
  position:absolute;
  inset:0;
  z-index:0;
  background-image:
    linear-gradient(var(--line) 1px, transparent 1px),
    linear-gradient(90deg, var(--line) 1px, transparent 1px);
  background-size:64px 64px;
  mask-image:radial-gradient(ellipse 80% 70% at 50% 50%, black 30%, transparent 80%);
  -webkit-mask-image:radial-gradient(ellipse 80% 70% at 50% 50%, black 30%, transparent 80%);
  opacity:0.5;
}

  z-index:2;
  max-width:1280px;
  margin:0 auto;
  width:100
